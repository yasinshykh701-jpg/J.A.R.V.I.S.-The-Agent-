<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#9b7dd4" />
    <title>Qazyen AI - Enterprise-Grade Intelligent Assistant Platform</title>
    
    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://ttojsmjktgafkjzaczdb.supabase.co" />
    <link rel="dns-prefetch" href="https://ttojsmjktgafkjzaczdb.supabase.co" />
    
    <!-- Inline critical CSS for instant rendering -->
    <style>
      /* Critical CSS for initial load */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Loading spinner styles */
      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      
      .dark .app-loader {
        background: #0a0a0a;
      }
      
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #9b7dd4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Hide loader when app is ready */
      .app-ready .app-loader {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading indicator -->
    <div class="app-loader">
      <div class="loader-spinner"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Remove loader when app is ready -->
    <script>
      window.addEventListener('load', () => {
        document.body.classList.add('app-ready');
      });
    </script>
  </body>
</html>
